name: campus_clock_slc
description: Campus Clock App for Shyam Lal College
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.7.10

  # UI & Utilities
  flutter_svg: ^2.1.0
  shared_preferences: ^2.3.3
  image_picker: ^1.0.7
  path_provider: ^2.1.4
  path: 1.8.3

  # Database
  sqflite: ^2.3.3

  # QR & Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # Web & URLs
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.1

  # Charts & Analytics
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # PDF & Sharing
  printing: ^5.13.0
  share_plus: ^9.0.0

  # Utilities
  async: ^2.11.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/app_logo.svg
