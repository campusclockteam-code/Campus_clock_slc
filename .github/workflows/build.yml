name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: List build output
      run: |
        echo "=== Checking build directories ==="
        ls -la build/app/outputs/flutter-apk/ || echo "Directory not found"
        echo ""
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f || echo "No APK found"
        echo ""
        echo "=== Build log tail ==="
        tail -50 build/app/outputs/flutter-apk/* 2>/dev/null || echo "No log"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-clock-app
        path: |
          build/app/outputs/flutter-apk/*.apk