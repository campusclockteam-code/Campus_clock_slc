name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: List all files
      run: |
        echo "=== Current directory ==="
        pwd
        echo ""
        echo "=== Build directory contents ==="
        find build -type f 2>/dev/null | head -50
        echo ""
        echo "=== Search for APK files ==="
        find . -name "*.apk" -type f
        echo ""
        echo "=== Check standard APK location ==="
        ls -la build/app/outputs/flutter-apk/ || echo "Directory not found"
        echo ""
        echo "=== Check release APK location ==="
        ls -la build/app/outputs/apk/release/ || echo "Directory not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-clock-app
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/apk/release/*.apk
          **/app-release.apk
          **/app-debug.apk
