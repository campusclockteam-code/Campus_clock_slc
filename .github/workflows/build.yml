name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Debug - List files
        run: |
          echo "Checking lib structure:"
          ls -la lib/
          echo ""
          echo "Checking for service folder:"
          ls -la lib/service/ || echo "service folder not found"
          ls -la lib/Service/ || echo "Service folder not found"
      
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: campus-clock-app
          path: build/app/outputs/flutter-apk/app-release.apk