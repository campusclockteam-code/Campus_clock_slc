name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Debug - List all directories
      run: |
        echo "=== Current directory ==="
        pwd
        echo ""
        echo "=== Directory structure ==="
        ls -la
        echo ""
        echo "=== build/app/outputs ==="
        ls -la build/app/outputs/ || echo "Not found"
        echo ""
        echo "=== flutter-apk directory ==="
        ls -la build/app/outputs/flutter-apk/ || echo "Not found"
        echo ""
        echo "=== Search for any APK ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK found"
        echo ""
        echo "=== Search in android folder ==="
        find android -name "*.apk" 2>/dev/null || echo "No APK found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-clock-app
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          android/app/build/outputs/apk/release/*.apk
          **/app-release.apk