name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
    
    - run: flutter pub get
    
    - name: Build with verbose output
      run: flutter build apk --release --verbose 2>&1 | tee build_log.txt
    
    - name: Check build directory
      run: |
        echo "=== Checking directories ==="
        ls -la build/app/outputs/ 2>/dev/null || echo "No outputs directory"
        echo ""
        echo "=== Searching for APK files ==="
        find . -name "*.apk" 2>/dev/null
        echo ""
        echo "=== Build log tail ==="
        tail -100 build_log.txt 2>/dev/null || echo "No log file"
    
    - name: Upload APK if found
      uses: actions/upload-artifact@v4
      with:
        name: campus-clock-app
        path: "**/*.apk"