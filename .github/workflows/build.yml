name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Find APK
      id: find_apk
      run: |
        # Try multiple possible locations
        if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
          echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT
          echo "Found APK at standard location"
        elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
          echo "apk_path=build/app/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          echo "Found APK at release location"
        else
          # Search for any APK
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
            echo "Found APK at: $APK_FILE"
          else
            echo "No APK found!"
            exit 1
          fi
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-clock-app
        path: ${{ steps.find_apk.outputs.apk_path }}
