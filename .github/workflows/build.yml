name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Find and upload APK
      run: |
        echo "Searching for APK files..."
        find . -name "*.apk" -type f
        echo ""
        echo "Checking flutter-apk directory..."
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory not found"
        echo ""
        echo "Checking release directory..."
        ls -la build/app/outputs/apk/release/ 2>/dev/null || echo "Directory not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-clock-app
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/apk/release/*.apk
          **/app-release.apk